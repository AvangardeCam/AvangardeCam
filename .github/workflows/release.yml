# Builds AvangardeCam.zip (folder "AvangardeCam" ready for FreeCAD's Mod folder)
# and attaches it to every published release.
name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the ZIP to"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build AvangardeCam.zip
        run: |
          git archive --format=zip --prefix=AvangardeCam/ -o AvangardeCam.zip HEAD \
            -- . ':!.github' ':!tests_gui'
          unzip -l AvangardeCam.zip | tail -1

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" AvangardeCam.zip --clobber
