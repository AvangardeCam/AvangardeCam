<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<!-- Seeds the profile of test_dark_system.py: FreeCAD's light theme, as on a
     user's FreeCAD. The runner copies tests_gui/<test>.user.cfg into the test's
     FREECAD_USER_HOME before the run. -->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="MainWindow">
          <FCText Name="StyleSheet">FreeCAD.qss</FCText>
          <FCText Name="Theme">FreeCAD Light</FCText>
          <FCText Name="OverlayActiveStyleSheet">Freecad Overlay.qss</FCText>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
