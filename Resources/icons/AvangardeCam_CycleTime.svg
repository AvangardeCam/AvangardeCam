<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8ccd2"/>
    </linearGradient>
  </defs>
  <!-- the crown and the side button -->
  <rect x="26" y="3" width="12" height="6" rx="1.5" fill="#729fcf" stroke="#2e3436" stroke-width="2"/>
  <rect x="29.5" y="8" width="5" height="6" fill="#2e3436"/>
  <rect x="48" y="12" width="6" height="8" rx="1" transform="rotate(45 51 16)" fill="#729fcf" stroke="#2e3436" stroke-width="2"/>
  <!-- the case and the dial -->
  <circle cx="32" cy="37" r="24" fill="#3465a4" stroke="#2e3436" stroke-width="2"/>
